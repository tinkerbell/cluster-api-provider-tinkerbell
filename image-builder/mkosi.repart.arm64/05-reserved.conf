[Partition]
# Placeholder that keeps partition numbers the same on both architectures.
# amd64 has a BIOS boot partition at p2, so root is p3 there. Reserving p2
# here puts root at p3 on arm64 too, and one provisioning template (writefile
# to partition 3) works for both. Nothing mounts or reads this partition.
# Do not remove it: templates hard-code partition 3 for root.
Type=linux-generic
Label=reserved
SizeMinBytes=1M
SizeMaxBytes=1M
