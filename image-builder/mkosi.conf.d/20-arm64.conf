# arm64 drop-in: EFI-only boot.
# arm64 servers boot via UEFI; no BIOS boot partition is needed.
#
# Boot through shim and Ubuntu's signed GRUB instead of the GRUB core mkosi
# assembles with grub-mkimage. Ubuntu's arm64 vmlinuz is gzip-compressed, and
# mkosi's core image does not embed the gzio module, so it cannot load the
# kernel ("plain image kernel not supported"). The signed grubaa64.efi has
# gzio built in, and shim lets the chain work with Secure Boot enabled.
#
# With a signed bootloader, mkosi defaults to expecting a distro-signed UKI
# (vmlinuz*.efi). Ubuntu ships none, so keep the plain kernel and GRUB
# entry by disabling UKIs explicitly.

[Match]
Architecture=arm64

[Content]
Bootloader=grub-signed
ShimBootloader=signed
UnifiedKernelImages=none
Packages=
        grub-efi-arm64-bin
        grub-efi-arm64-signed
        shim-signed
