name: Release Workflow
on:
  push:
    tags:
      - "v*"
env:
  CGO_ENABLED: 0
  GO_VERSION: '1.27'
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

# Jobs that publish declare the extra permissions they need. A job-level
# block replaces this one, so it must also grant contents.
permissions:
  contents: read

# Actions are pinned by commit SHA, with the version in a comment, so a moved
# tag cannot change what runs next to the publishing credentials. Dependabot
# updates the pins.
#
# Release builds don't restore the Go caches, so a cache written by another
# run cannot end up in a release artifact.
jobs:
  # A release tag must point to a commit on main. The tag ruleset controls who
  # can push a tag, not which commit it points to.
  check-tag:
    name: Check the tagged commit is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tagged commit is on main
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main is missing from the checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main"
            exit 1
          fi

  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the image to ghcr.io
    needs:
      - check-tag
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: make build-image-push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release and uploads its assets
    needs:
      - build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Create manifests
        run: make release

      # Into a file, not $GITHUB_ENV: the notes include PR titles.
      - name: Generate Release Notes
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -F tag_name="${GITHUB_REF_NAME}" --jq .body > "${RUNNER_TEMP}/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: out/release/*
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
