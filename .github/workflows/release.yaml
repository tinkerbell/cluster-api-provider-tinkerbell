name: Release Workflow
# Runs for each release tag: checks the tag, builds from a cold cache,
# publishes and signs the image, attests the release assets, and publishes
# the GitHub release. What it signs and attests carries the identity
# .github/workflows/release.yaml@refs/tags/<tag>, which
# docs/VERIFYING_ARTIFACTS.md tells users to check.
#
# An artifact carries the release assets between jobs, but any job in the run
# can replace an artifact. Only a job can set its own outputs, so the jobs
# that sign, attest or publish use the checksums and digest other jobs
# output, never what came with a download.
on:
  push:
    tags:
      - "v*"
# A second run for the same tag (a re-pushed tag) waits for the first, so two
# runs never push, sign or publish the same version at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: 0
  GO_VERSION: '1.27'
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

# Jobs that publish declare the extra permissions they need. A job-level
# block replaces this one, so it must also grant contents.
permissions:
  contents: read

# Actions are pinned by commit SHA, with the version in a comment, so a moved
# tag cannot change what runs next to the publishing credentials. Dependabot
# updates the pins.
#
# Release builds don't restore the Go caches, so a cache written by another
# run cannot end up in a release artifact.
jobs:
  # A release tag must point to a commit on main. The tag ruleset controls who
  # can push a tag, not which commit it points to.
  check-tag:
    name: Check the tagged commit is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tagged commit is on main
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main is missing from the checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main"
            exit 1
          fi

  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the image to ghcr.io
    needs:
      - check-tag
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: make build-image-push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser records one artifact per pushed tag, all with the same
      # digest. sign-image checks it against what the registry serves.
      # dockers_v2 images have the type "Docker Image" in artifacts.json.
      - name: Record the pushed digest
        id: digest
        run: |
          digest=$(jq -er --arg ref "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" '
            [.[] | select(.type == "Docker Image")] as $images
            | if ($images | map(select(.name == $ref)) | length) != 1 then error("no single artifact for \($ref)")
              elif ($images | map(.extra.Digest) | unique | length) != 1 then error("the pushed tags have different digests")
              else $images[0].extra.Digest // error("no digest for \($ref)") end' dist/artifacts.json)
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::malformed digest in dist/artifacts.json: ${digest}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  # Builds the release assets and outputs their checksums. kustomize runs
  # here, so the jobs holding the OIDC token or contents: write don't run it.
  release-manifests:
    name: Build the release assets
    runs-on: ubuntu-latest
    needs:
      - check-tag
    outputs:
      sha256sums: ${{ steps.checksums.outputs.sha256sums }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Create manifests
        run: make release

      # Base64 keeps the sha256sum lines on one line.
      - name: Record the checksums
        id: checksums
        working-directory: out/release
        run: |
          sums=$(sha256sum -- *)
          echo "sha256sums=$(base64 --wrap=0 <<<"${sums}")" >> "$GITHUB_OUTPUT"

      # Kept for 7 days so a failed release job can be re-run on its own.
      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: out/release/
          if-no-files-found: error
          retention-days: 7

  # Holds the OIDC token that signs as this workflow. It runs checkout,
  # cosign-installer and cosign, plus jq and docker buildx imagetools from the
  # runner image, and signs only the digest from build-image's outputs.
  sign-image:
    name: Sign the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # cosign pushes the signatures next to the image
      id-token: write # keyless cosign signing: the token identifies the workflow
    needs:
      - build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Log in to the Container registry
        run: cosign login "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin <<<"${TOKEN}"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the image
        run: ./hack/sign-image.sh "${REGISTRY}/${IMAGE_NAME}" "${GITHUB_REF_NAME}" "${DIGEST}"
        env:
          DIGEST: ${{ needs.build-image.outputs.digest }}

  # One SLSA build provenance attestation whose subjects are the release
  # assets, stored by GitHub and verified with `gh attestation verify`. It
  # waits for sign-image, so a run that fails to build or sign the image
  # leaves no attestation under the release identity.
  attest-assets:
    name: Attest the release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the token identifies the workflow in the attestation
      attestations: write # stores the attestation
    needs:
      - release-manifests
      - sign-image
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release

      - name: Check the release assets
        run: ./hack/check-release-assets.sh "${RUNNER_TEMP}/release" "${SHA256SUMS}"
        env:
          SHA256SUMS: ${{ needs.release-manifests.outputs.sha256sums }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*

  # Publishes only after the image is signed and the assets attested, so a
  # release never appears without them.
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release and uploads its assets
    needs:
      - release-manifests
      - sign-image
      - attest-assets
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release

      # The same check as attest-assets, so this publishes what it attested.
      - name: Check the release assets
        run: ./hack/check-release-assets.sh "${RUNNER_TEMP}/release" "${SHA256SUMS}"
        env:
          SHA256SUMS: ${{ needs.release-manifests.outputs.sha256sums }}

      # With assets, gh creates a draft, uploads them, then publishes, so the
      # release never shows with some assets missing.
      - name: Create the GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" "${RUNNER_TEMP}"/release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
