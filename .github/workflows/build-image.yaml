name: Build and Push Kubernetes Node Image
run-name: Build k8s ${{ inputs.kubernetesVersion || 'v1.35.2' }} (ubuntu 24.04)

on:
  workflow_dispatch:
    inputs:
      kubernetesVersion:
        description: "Kubernetes version (e.g., v1.35.2)"
        required: true
        default: "v1.35.2"

# KUBERNETES_VERSION comes from a workflow input, so run steps read it as a
# shell variable, never as an expression expanded into the script.
env:
  REGISTRY: ghcr.io
  KUBERNETES_VERSION: ${{ inputs.kubernetesVersion || 'v1.35.2' }}
  UBUNTU_VERSION: "24.04"

# The push job declares the extra permission it needs. A job-level block
# replaces this one, so it must also grant contents.
permissions:
  contents: read

# Actions are pinned by commit SHA, with the version in a comment, so a moved
# tag cannot change what runs next to the registry credentials. Dependabot
# updates the pins.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-mkosi
        uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Install mkosi Python dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pefile mtools

      - name: Build image
        working-directory: image-builder
        run: |
          make build \
            ARCH=${{ matrix.arch }} \
            KUBERNETES_VERSION="${KUBERNETES_VERSION}" \
            UBUNTU_VERSION="${UBUNTU_VERSION}"

      - name: Validate image
        working-directory: image-builder
        run: |
          make validate \
            ARCH=${{ matrix.arch }} \
            UBUNTU_VERSION="${UBUNTU_VERSION}" \
            KUBERNETES_VERSION="${KUBERNETES_VERSION}"

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-k8s-${{ env.KUBERNETES_VERSION }}-${{ matrix.arch }}
          path: |
            image-builder/mkosi.output/${{ env.UBUNTU_VERSION }}/${{ env.KUBERNETES_VERSION }}/${{ matrix.arch }}/*.raw.gz
            image-builder/mkosi.output/${{ env.UBUNTU_VERSION }}/${{ env.KUBERNETES_VERSION }}/${{ matrix.arch }}/*.sha256
          retention-days: 2

  push:
    needs: build
    permissions:
      contents: read
      packages: write # pushes the node images to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-k8s-${{ env.KUBERNETES_VERSION }}-${{ matrix.arch }}
          path: image-builder/mkosi.output/${{ env.UBUNTU_VERSION }}/${{ env.KUBERNETES_VERSION }}/${{ matrix.arch }}/

      - name: Install oras
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4

      - name: Log in to container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Push image to OCI registry
        working-directory: image-builder
        run: |
          make push \
            ARCH=${{ matrix.arch }} \
            KUBERNETES_VERSION="${KUBERNETES_VERSION}" \
            OCI_REGISTRY="${REGISTRY}" \
            OCI_REPOSITORY="${OWNER_LC}/cluster-api-provider-tinkerbell/ubuntu"
